<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>ハイペリオンの休日 POC</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Murecho:wght@500;700;800;900&family=Noto+Sans+JP:wght@400;500;700&family=Orbitron:wght@600;800&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: #DDE4EF; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react,typescript">
const { useState, useEffect, useRef } = React;

/**
 * ハイペリオンの休日 — 会場アプリ クリックモック (PoC)
 * 崩壊3rd 非公式オフラインイベント向け / 画面遷移確認用
 *
 * 仕様メモ:
 *  - 全データはダミー。バックエンド無し（モック）。
 *  - デザインは「ライトモード固定」。暗い背景は一切使わない。
 *  - 3陣営カラー（蒼/緋/菫）でゲーム的に色分け。
 *
 * 出典: HyperionHoliday_AppMock.jsx（Claude Codeによる作成）を
 *       CDN読込のみで動く単一HTMLへ移植したもの。
 */

// ------- デザイントークン -------
const INK = "#1B2230";
const SUB = "#5C667A";
const LINE = "#E4E9F1";
const BG = "#EEF2F8";
const PANEL = "#FFFFFF";
const GOLD = "#E0A02E";

const FACTIONS = {
  azure: { id: "azure", name: "蒼の陣営", code: "VANGUARD", color: "#2E6BE6", tint: "#E8F0FE", glyph: "❖" },
  crimson: { id: "crimson", name: "緋の陣営", code: "IGNITE", color: "#E0334B", tint: "#FCE9EC", glyph: "✦" },
  violet: { id: "violet", name: "菫の陣営", code: "PROJECT-B", color: "#7C4DE0", tint: "#F0EAFC", glyph: "✧" },
};
const FACTION_LIST = [FACTIONS.azure, FACTIONS.crimson, FACTIONS.violet];

// ------- ダミーデータ -------
const BOOTHS = [
  { id: 1, name: "受付ゲート", icon: "🎫" },
  { id: 2, name: "メインステージ", icon: "🎤" },
  { id: 3, name: "物販エリア", icon: "🛍️" },
  { id: 4, name: "フォトスポット", icon: "📸" },
  { id: 5, name: "ファンアート展", icon: "🎨" },
  { id: 6, name: "コスプレ広場", icon: "✨" },
  { id: 7, name: "休憩ラウンジ", icon: "☕" },
  { id: 8, name: "出口記念", icon: "🏁" },
];

const QUIZ = {
  q: "「ハイペリオンの休日」の交流を検討している方向けに用意されているツールは？",
  options: ["Slack", "Discord", "LINEオープンチャット", "Teams"],
  answer: 1,
  explain: "正解は「Discord」。一人参加でも安心できるよう、公式サイトから交流用Discordサーバーへの案内があります。",
};

const EXHIBITORS = [
  { id: 1, name: "studio NOVA", genre: "アクリルスタンド", color: "#2E6BE6" },
  { id: 2, name: "緋色工房", genre: "イラスト集 / 缶バッジ", color: "#E0334B" },
  { id: 3, name: "Lavender Works", genre: "刺繍ワッペン", color: "#7C4DE0" },
  { id: 4, name: "Hyperion Goods", genre: "ステッカー / キーホルダー", color: "#E0A02E" },
];

const SCHEDULE = [
  { t: "11:00", title: "開場・受付開始", spot: "受付ゲート", soon: false },
  { t: "12:30", title: "オープニングトーク", spot: "メインステージ", soon: true },
  { t: "14:00", title: "陣営バトル 中間発表", spot: "メインステージ", soon: false },
  { t: "15:30", title: "コスプレ撮影会", spot: "コスプレ広場", soon: false },
  { t: "17:00", title: "陣営バトル 結果発表", spot: "メインステージ", soon: false },
  { t: "17:30", title: "クロージング", spot: "メインステージ", soon: false },
];

const BOARD = [
  { id: 1, who: "あおい", body: "蒼陣営、一緒にスタンプ集めましょ〜！受付前にいます🩵", faction: "azure" },
  { id: 2, who: "れん", body: "物販エリアのアクスタ完売しそう、お早めに！", faction: "crimson" },
  { id: 3, who: "みやび", body: "フォトスポットのフレーム可愛すぎる📸", faction: "violet" },
];

const WALLPAPERS = [
  { id: 1, label: "蒼 / Vanguard", from: "#3B7BF0", to: "#7FB0FF" },
  { id: 2, label: "緋 / Ignite", from: "#E0334B", to: "#FF8A8A" },
  { id: 3, label: "菫 / Project-B", from: "#7C4DE0", to: "#B79CF5" },
  { id: 4, label: "限定 / Hyperion", from: "#E0A02E", to: "#F7D27A" },
];

const FRAMES = [
  { id: 1, label: "陣営カラー枠", color: "#2E6BE6" },
  { id: 2, label: "イベントロゴ枠", color: "#E0A02E" },
  { id: 3, label: "星屑フレーム", color: "#7C4DE0" },
];

// ------- 小物 -------
function Chip({ children, color = INK, bg = "#F1F4FA" }) {
  return (
    <span style={{ fontSize: 11, fontWeight: 700, color, background: bg, padding: "3px 9px", borderRadius: 999, letterSpacing: ".02em" }}>
      {children}
    </span>
  );
}

function SectionTitle({ children, sub }) {
  return (
    <div style={{ marginBottom: 12 }}>
      <div className="hp-disp" style={{ fontSize: 19, fontWeight: 800, color: INK, letterSpacing: ".01em" }}>{children}</div>
      {sub && <div style={{ fontSize: 12.5, color: SUB, marginTop: 3 }}>{sub}</div>}
    </div>
  );
}

function Card({ children, style }) {
  return (
    <div style={{ background: PANEL, border: `1px solid ${LINE}`, borderRadius: 16, boxShadow: "0 6px 18px rgba(27,34,48,.05)", ...style }}>
      {children}
    </div>
  );
}

// ===================================================================
function HyperionHolidayMock() {
  const [screen, setScreen] = useState("onboard"); // onboard | home | rally | battle | map | menu | quiz | frame | board | schedule | exhibitors | wallpaper
  const [faction, setFaction] = useState(null);

  const goHome = (f) => { setFaction(f); setScreen("home"); };

  return (
    <div style={{ minHeight: "100vh", width: "100%", display: "flex", alignItems: "flex-start", justifyContent: "center", background: "#DDE4EF", padding: "20px 12px", boxSizing: "border-box", fontFamily: "'Noto Sans JP', sans-serif", color: INK }}>
      <style>{`
        .hp-disp{ font-family:'Murecho','Noto Sans JP',sans-serif; }
        .hp-hud{ font-family:'Orbitron','Murecho',sans-serif; letter-spacing:.06em; }
        @keyframes hpUp{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
        @keyframes hpPop{ 0%{transform:scale(.4); opacity:0;} 60%{transform:scale(1.12);} 100%{transform:scale(1); opacity:1;} }
        @keyframes hpScan{ 0%,100%{opacity:.35;} 50%{opacity:1;} }
        @keyframes hpBar{ from{width:0;} }
        @keyframes hpFloat{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-5px);} }
        .hp-screen{ animation:hpUp .32s ease both; }
        .hp-tap:active{ transform:scale(.97); }
        .hp-scroll::-webkit-scrollbar{ width:0; }
      `}</style>

      {/* デバイスフレーム（ライト） */}
      <div style={{ width: "100%", maxWidth: 392, height: "min(840px, 93vh)", background: "#F4F7FC", borderRadius: 30, border: `1px solid #CBD4E2`, boxShadow: "0 24px 60px rgba(27,34,48,.22)", overflow: "hidden", display: "flex", flexDirection: "column", position: "relative" }}>

        {/* PoCリボン */}
        <div style={{ position: "absolute", top: 12, right: -34, transform: "rotate(38deg)", background: GOLD, color: "#fff", fontSize: 10, fontWeight: 800, padding: "3px 36px", zIndex: 50, letterSpacing: ".08em" }} className="hp-hud">MOCK</div>

        {screen === "onboard"
          ? <Onboard onDone={goHome} />
          : (
            <>
              <TopBar faction={faction} screen={screen} />
              <main className="hp-scroll" style={{ flex: 1, overflowY: "auto", padding: "16px 16px 24px" }}>
                <ScreenRouter screen={screen} setScreen={setScreen} faction={faction} setFaction={setFaction} />
              </main>
              <TabBar screen={screen} setScreen={setScreen} faction={faction} />
            </>
          )}
      </div>
    </div>
  );
}

// ------- 上部バー -------
function TopBar({ faction, screen }) {
  const f = faction || FACTIONS.azure;
  const titles = {
    home: "ホーム", rally: "スタンプラリー", battle: "陣営バトル", map: "会場マップ",
    menu: "メニュー", quiz: "クイズ", frame: "フォトフレーム", board: "掲示板",
    schedule: "タイムテーブル", exhibitors: "出展者", wallpaper: "限定壁紙",
  };
  return (
    <header style={{ background: PANEL, borderBottom: `1px solid ${LINE}`, padding: "12px 16px 11px", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
      <div>
        <div className="hp-hud" style={{ fontSize: 10, color: SUB }}>HYPERION HOLIDAY</div>
        <div className="hp-disp" style={{ fontSize: 17, fontWeight: 800 }}>{titles[screen] || ""}</div>
      </div>
      <div style={{ display: "flex", alignItems: "center", gap: 7, background: f.tint, border: `1px solid ${f.color}33`, padding: "5px 10px", borderRadius: 999 }}>
        <span style={{ color: f.color, fontSize: 14 }}>{f.glyph}</span>
        <span style={{ fontSize: 12, fontWeight: 700, color: f.color }}>{f.name}</span>
      </div>
    </header>
  );
}

// ------- 下部タブ -------
function TabBar({ screen, setScreen, faction }) {
  const f = faction || FACTIONS.azure;
  const tabs = [
    { id: "home", label: "ホーム", icon: "⌂" },
    { id: "rally", label: "ラリー", icon: "◉" },
    { id: "battle", label: "バトル", icon: "⚔" },
    { id: "map", label: "マップ", icon: "🗺" },
    { id: "menu", label: "メニュー", icon: "☰" },
  ];
  return (
    <nav style={{ background: PANEL, borderTop: `1px solid ${LINE}`, display: "flex", padding: "7px 4px 9px" }}>
      {tabs.map((t) => {
        const active = screen === t.id || (t.id === "menu" && ["quiz", "frame", "board", "schedule", "exhibitors", "wallpaper"].includes(screen));
        return (
          <button key={t.id} onClick={() => setScreen(t.id)} className="hp-tap"
            style={{ flex: 1, border: "none", background: "transparent", cursor: "pointer", display: "flex", flexDirection: "column", alignItems: "center", gap: 3, padding: "4px 0", color: active ? f.color : "#9AA4B6", transition: "color .15s" }}>
            <span style={{ fontSize: 17, lineHeight: 1 }}>{t.icon}</span>
            <span style={{ fontSize: 10.5, fontWeight: active ? 800 : 600 }}>{t.label}</span>
          </button>
        );
      })}
    </nav>
  );
}

// ------- ルーター -------
function ScreenRouter({ screen, setScreen, faction, setFaction }) {
  const f = faction || FACTIONS.azure;
  switch (screen) {
    case "home": return <Home key="home" f={f} setScreen={setScreen} />;
    case "rally": return <Rally key="rally" f={f} />;
    case "battle": return <Battle key="battle" f={f} />;
    case "map": return <MapScreen key="map" f={f} />;
    case "menu": return <Menu key="menu" f={f} setScreen={setScreen} setFaction={setFaction} />;
    case "quiz": return <Quiz key="quiz" f={f} />;
    case "frame": return <Frame key="frame" f={f} />;
    case "board": return <Board key="board" f={f} />;
    case "schedule": return <Schedule key="schedule" f={f} />;
    case "exhibitors": return <Exhibitors key="exhibitors" f={f} />;
    case "wallpaper": return <Wallpaper key="wallpaper" f={f} />;
    default: return null;
  }
}

// ===================== 入口: 陣営割り当て =====================
function Onboard({ onDone }) {
  const [phase, setPhase] = useState("intro"); // intro | scanning | result
  const [picked, setPicked] = useState(null);
  const [nickname, setNickname] = useState("");

  const canAssign = nickname.trim().length > 0;

  const assign = () => {
    if (!canAssign) return;
    setPhase("scanning");
    setTimeout(() => {
      const f = FACTION_LIST[Math.floor(Math.random() * 3)];
      setPicked(f);
      setPhase("result");
    }, 1600);
  };

  return (
    <div className="hp-screen" style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 26, textAlign: "center", background: phase === "result" && picked ? picked.tint : "#F4F7FC", transition: "background .5s" }}>
      <div className="hp-hud" style={{ fontSize: 11, color: SUB, marginBottom: 6 }}>HYPERION HOLIDAY · 非公式オフラインイベント</div>

      {phase === "intro" && (
        <>
          <div style={{ fontSize: 54, marginBottom: 8, animation: "hpFloat 3s ease-in-out infinite" }}>🛰️</div>
          <div className="hp-disp" style={{ fontSize: 26, fontWeight: 900, lineHeight: 1.3, marginBottom: 10 }}>ようこそ、<br />ハイペリオンへ</div>
          <p style={{ fontSize: 13.5, color: SUB, lineHeight: 1.7, maxWidth: 270, marginBottom: 20 }}>来場するとあなたの陣営が決まります。仲間とスタンプを集めて、陣営バトルを勝ち抜こう。</p>
          <input
            value={nickname}
            onChange={(e) => setNickname(e.target.value.slice(0, 20))}
            placeholder="ニックネームを入力"
            maxLength={20}
            style={{ width: "100%", maxWidth: 260, boxSizing: "border-box", border: `1px solid ${LINE}`, borderRadius: 12, padding: "12px 14px", fontSize: 14.5, marginBottom: 18, background: PANEL, color: INK, textAlign: "center" }}
          />
          <button onClick={assign} disabled={!canAssign} className="hp-tap" style={{ background: canAssign ? FACTIONS.azure.color : LINE, color: canAssign ? "#fff" : SUB, border: "none", borderRadius: 14, padding: "15px 40px", fontSize: 15.5, fontWeight: 800, cursor: canAssign ? "pointer" : "not-allowed", boxShadow: canAssign ? "0 10px 24px rgba(46,107,230,.3)" : "none", transition: "background .2s,box-shadow .2s" }}>陣営を割り当てる</button>
        </>
      )}

      {phase === "scanning" && (
        <>
          <div style={{ fontSize: 56, marginBottom: 16, animation: "hpScan 1s ease-in-out infinite" }}>📡</div>
          <div className="hp-hud" style={{ fontSize: 15, fontWeight: 800, color: INK }}>SCANNING...</div>
          <div style={{ fontSize: 13, color: SUB, marginTop: 8 }}>あなたの適性を解析しています</div>
          <div style={{ display: "flex", gap: 8, marginTop: 22 }}>
            {FACTION_LIST.map((x, i) => (
              <span key={x.id} style={{ width: 14, height: 14, borderRadius: 999, background: x.color, animation: "hpScan 1s ease-in-out infinite", animationDelay: `${i * .2}s` }} />
            ))}
          </div>
        </>
      )}

      {phase === "result" && picked && (
        <div style={{ animation: "hpPop .5s ease both" }}>
          <div className="hp-hud" style={{ fontSize: 11, color: picked.color, letterSpacing: ".12em", marginBottom: 4 }}>YOUR FACTION</div>
          <div style={{ fontSize: 60, color: picked.color, marginBottom: 4 }}>{picked.glyph}</div>
          <div className="hp-disp" style={{ fontSize: 30, fontWeight: 900, color: picked.color }}>{picked.name}</div>
          <div className="hp-hud" style={{ fontSize: 12, color: SUB, marginTop: 4, marginBottom: 10 }}>{picked.code}</div>
          {nickname.trim() && <div style={{ fontSize: 13, color: SUB, marginBottom: 26 }}>ようこそ、{nickname.trim()}さん</div>}
          <button onClick={() => onDone(picked)} className="hp-tap" style={{ background: picked.color, color: "#fff", border: "none", borderRadius: 14, padding: "14px 44px", fontSize: 15, fontWeight: 800, cursor: "pointer", boxShadow: `0 10px 24px ${picked.color}44` }}>はじめる →</button>
        </div>
      )}
    </div>
  );
}

// ===================== ホーム =====================
function Home({ f, setScreen }) {
  const quick = [
    { id: "rally", label: "スタンプラリー", icon: "◉", desc: "あと3個でコンプ" },
    { id: "battle", label: "陣営バトル", icon: "⚔", desc: "蒼が首位！" },
    { id: "quiz", label: "クイズに挑戦", icon: "❓", desc: "QRを読み取る" },
    { id: "wallpaper", label: "限定壁紙", icon: "🖼", desc: "4種 配布中" },
  ];
  return (
    <div className="hp-screen" style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      {/* 陣営カード */}
      <div style={{ background: f.tint, border: `1px solid ${f.color}33`, borderRadius: 18, padding: 16, position: "relative", overflow: "hidden" }}>
        <div style={{ position: "absolute", right: -8, top: -10, fontSize: 88, opacity: .12, color: f.color }}>{f.glyph}</div>
        <div className="hp-hud" style={{ fontSize: 10, color: f.color }}>{f.code}</div>
        <div className="hp-disp" style={{ fontSize: 23, fontWeight: 900, color: f.color, margin: "2px 0 10px" }}>{f.name}</div>
        <div style={{ display: "flex", gap: 18 }}>
          <Stat label="獲得スタンプ" value="5" unit="/8" color={f.color} />
          <Stat label="貢献ポイント" value="120" unit="pt" color={f.color} />
        </div>
      </div>

      {/* 限定壁紙バナー */}
      <div onClick={() => setScreen("wallpaper")} className="hp-tap" style={{ cursor: "pointer", borderRadius: 16, padding: "14px 16px", display: "flex", alignItems: "center", gap: 12, background: "linear-gradient(100deg,#FBEFD3,#FFF6E6)", border: `1px solid ${GOLD}33` }}>
        <span style={{ fontSize: 26 }}>🎁</span>
        <div style={{ flex: 1 }}>
          <div style={{ fontSize: 14, fontWeight: 800 }}>限定壁紙を配布中</div>
          <div style={{ fontSize: 12, color: SUB }}>来場特典の4種をダウンロード</div>
        </div>
        <span style={{ color: GOLD, fontWeight: 800 }}>›</span>
      </div>

      {/* クイックアクション */}
      <div>
        <SectionTitle>できること</SectionTitle>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
          {quick.map((q) => (
            <button key={q.id} onClick={() => setScreen(q.id)} className="hp-tap" style={{ textAlign: "left", cursor: "pointer", background: PANEL, border: `1px solid ${LINE}`, borderRadius: 14, padding: 13 }}>
              <div style={{ fontSize: 20, marginBottom: 6 }}>{q.icon}</div>
              <div style={{ fontSize: 13.5, fontWeight: 800 }}>{q.label}</div>
              <div style={{ fontSize: 11, color: SUB, marginTop: 2 }}>{q.desc}</div>
            </button>
          ))}
        </div>
      </div>

      {/* 次の予定 */}
      <div>
        <SectionTitle sub="タイムテーブルに合わせて通知が届きます">次の予定</SectionTitle>
        <Card style={{ padding: 14, display: "flex", alignItems: "center", gap: 12 }}>
          <div className="hp-hud" style={{ fontSize: 16, fontWeight: 800, color: f.color }}>12:30</div>
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: 13.5, fontWeight: 700 }}>オープニングトーク</div>
            <div style={{ fontSize: 11.5, color: SUB }}>メインステージ</div>
          </div>
          <Chip color={f.color} bg={f.tint}>まもなく</Chip>
        </Card>
      </div>
    </div>
  );
}
function Stat({ label, value, unit, color }) {
  return (
    <div>
      <div style={{ fontSize: 11, color: SUB, marginBottom: 1 }}>{label}</div>
      <div><span className="hp-hud" style={{ fontSize: 22, fontWeight: 800, color }}>{value}</span><span style={{ fontSize: 12, color: SUB, marginLeft: 2 }}>{unit}</span></div>
    </div>
  );
}

// ===================== スタンプラリー =====================
function Rally({ f }) {
  const [collected, setCollected] = useState({ 1: true, 2: true, 3: true, 5: true, 6: true });
  const [reward, setReward] = useState(false);
  const count = Object.values(collected).filter(Boolean).length;
  const pct = Math.round((count / BOOTHS.length) * 100);

  const next = BOOTHS.find((b) => !collected[b.id]);
  const scan = () => {
    if (!next) return;
    setCollected((c) => ({ ...c, [next.id]: true }));
  };

  return (
    <div className="hp-screen" style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <Card style={{ padding: 16 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 8 }}>
          <div style={{ fontSize: 13, fontWeight: 700, color: SUB }}>達成率</div>
          <div><span className="hp-hud" style={{ fontSize: 26, fontWeight: 800, color: f.color }}>{count}</span><span style={{ color: SUB, fontSize: 14 }}> / {BOOTHS.length}</span></div>
        </div>
        <div style={{ height: 10, background: "#EEF1F7", borderRadius: 999, overflow: "hidden" }}>
          <div style={{ width: `${pct}%`, height: "100%", background: f.color, borderRadius: 999, transition: "width .5s" }} />
        </div>
        <div style={{ fontSize: 12, color: SUB, marginTop: 8 }}>集めたスタンプは陣営バトルの集計に反映されます。コンプリートで特典コードを受け取れます。</div>
      </Card>

      <button onClick={count === BOOTHS.length ? () => setReward(true) : scan} className="hp-tap"
        style={{ border: "none", cursor: "pointer", borderRadius: 14, padding: "15px", fontSize: 15, fontWeight: 800, color: "#fff", background: count === BOOTHS.length ? GOLD : f.color, boxShadow: `0 8px 20px ${(count === BOOTHS.length ? GOLD : f.color)}40` }}>
        {count === BOOTHS.length ? "🎉 特典コードを表示" : `📷 QRを読み取る（${next ? next.name : ""}）`}
      </button>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
        {BOOTHS.map((b) => {

  );
}

// ===================== クイズ =====================
function Quiz({ f }) {
  const [stage, setStage] = useState("scan"); // scan | q | result
  const [choice, setChoice] = useState(null);

  if (stage === "scan") {
    return (
      <div className="hp-screen" style={{ display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", height: "100%", textAlign: "center", padding: 10 }}>
        <div style={{ width: 200, height: 200, borderRadius: 22, border: `2px dashed ${f.color}`, background: f.tint, display: "flex", alignItems: "center", justifyContent: "center", marginBottom: 18 }}>
          <span style={{ fontSize: 64, animation: "hpScan 1.4s ease-in-out infinite" }}>🔳</span>
        </div>
        <div style={{ fontSize: 14, fontWeight: 800 }}>会場のQRコードを読み取り</div>
        <div style={{ fontSize: 12, color: SUB, margin: "5px 0 18px" }}>問題パネルのコードをスキャンしてください</div>
        <button onClick={() => setStage("q")} className="hp-tap" style={{ border: "none", cursor: "pointer", background: f.color, color: "#fff", borderRadius: 12, padding: "13px 34px", fontSize: 14, fontWeight: 800 }}>スキャンする（デモ）</button>
      </div>
    );
  }

  return (
    <div className="hp-screen" style={{ display: "flex", flexDirection: "column", gap: 14 }}>
      <Card style={{ padding: 16 }}>
        <Chip color={f.color} bg={f.tint}>QUIZ #01</Chip>
        <div className="hp-disp" style={{ fontSize: 16, fontWeight: 800, lineHeight: 1.55, marginTop: 10 }}>{QUIZ.q}</div>
      </Card>
      <div style={{ display: "flex", flexDirection: "column", gap: 9 }}>
        {QUIZ.options.map((o, i) => {
          const revealed = stage === "result";
          const correct = i === QUIZ.answer;
          const chosen = i === choice;
          let bg = PANEL, bd = LINE, col = INK;
          if (revealed && correct) { bg = "#EAF7EE"; bd = "#4AA06B"; col = "#2E7D4B"; }
          else if (revealed && chosen && !correct) { bg = "#FCEBED"; bd = "#E0334B"; col = "#C42A40"; }
          return (
            <button key={i} disabled={revealed} onClick={() => { setChoice(i); setStage("result"); }} className="hp-tap"
              style={{ textAlign: "left", cursor: revealed ? "default" : "pointer", background: bg, border: `1.5px solid ${bd}`, borderRadius: 13, padding: "13px 15px", fontSize: 13.5, fontWeight: 700, color: col, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <span>{o}</span>
              {revealed && correct && <span>✓</span>}
              {revealed && chosen && !correct && <span>✕</span>}
            </button>
          );
        })}
      </div>
      {stage === "result" && (
        <Card style={{ padding: 14, background: f.tint, border: `1px solid ${f.color}33`, animation: "hpUp .3s ease both" }}>
          <div style={{ fontSize: 12.5, fontWeight: 800, color: f.color, marginBottom: 4 }}>解説</div>
          <div style={{ fontSize: 12.5, color: INK, lineHeight: 1.7 }}>{QUIZ.explain}</div>
        </Card>
      )}
    </div>
  );
}

// ===================== 掲示板 =====================
function Board({ f }) {
  const [posts, setPosts] = useState(BOARD);
  const [text, setText] = useState("");
  const add = () => {
    if (!text.trim()) return;
    setPosts([{ id: Date.now(), who: "あなた", body: text, faction: f.id }, ...posts]);
    setText("");
  };
  return (
    <div className="hp-screen" style={{ display: "flex", flexDirection: "column", gap: 12 }}>
      <Card style={{ padding: 10, display: "flex", gap: 8 }}>
        <input value={text} onChange={(e) => setText(e.target.value)} placeholder="ひとことを投稿…"
          style={{ flex: 1, border: `1px solid ${LINE}`, borderRadius: 10, padding: "10px 12px", fontSize: 13, outline: "none", background: "#F8FAFD", color: INK }} />
        <button onClick={add} className="hp-tap" style={{ border: "none", cursor: "pointer", background: f.color, color: "#fff", borderRadius: 10, padding: "0 16px", fontSize: 13, fontWeight: 800 }}>投稿</button>
      </Card>
      {posts.map((p) => {
        const pf = FACTIONS[p.faction] || FACTIONS.azure;
        return (
          <Card key={p.id} style={{ padding: 13, borderLeft: `4px solid ${pf.color}` }}>
            <div style={{ display: "flex", alignItems: "center", gap: 7, marginBottom: 5 }}>
              <span style={{ color: pf.color }}>{pf.glyph}</span>
              <span style={{ fontSize: 12.5, fontWeight: 800 }}>{p.who}</span>
              <Chip color={pf.color} bg={pf.tint}>{pf.name}</Chip>
            </div>
            <div style={{ fontSize: 13, color: INK, lineHeight: 1.6 }}>{p.body}</div>
          </Card>
        );
      })}
    </div>
  );
}
